name: amplify_grocery_list
description: Grocery List to show AWS Amplify

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=2.18.4 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.1.9
  google_fonts: ^6.2.1
  # Flutter relies on the version 1.16.0 for collection
  collection: ^1.16.0
  amplify_flutter: ^2.6.1
  amplify_auth_cognito: ^2.6.1
  amplify_authenticator: ^2.3.3
  amplify_api: ^2.6.1
  amplify_storage_s3: ^2.6.1
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  cached_network_image: ^3.2.3
  flex_color_scheme: ^8.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true